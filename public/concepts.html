<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinyTracker design concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Page chrome (the review tool around the phone). Neutral, mode-independent.
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#26272b;color:#e8e6e1;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent,#d1884a);outline-offset:2px}
svg{display:block;flex:none}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:#1d1e21;border-bottom:1px solid #35363b}
.bar h1{font-size:14px;font-weight:600;margin:0 auto 0 0;color:#c9c6bf}
.bar h1 small{font-weight:500;color:#8a8880;margin-left:8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:#111214}
.seg button{height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;color:#9a9890}
.seg button[aria-pressed=true]{background:#3a3b40;color:#fff}

.stage{display:flex;justify-content:center;align-items:flex-start;gap:48px;padding:36px 16px 64px}
.notes{width:320px;flex:none;font-size:14px;line-height:1.5;color:#c9c6bf}
.notes h2{font-size:24px;margin:0 0 2px;color:#fff;letter-spacing:-.01em}
.notes .sub{margin:0 0 14px;color:#8a8880}
.notes .thesis{font-size:16px;color:#e8e6e1;margin:0 0 18px}
.notes dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.notes dt{color:#8a8880}
.notes dd{margin:0}
.swatches{display:flex;gap:6px;margin:0 0 18px}
.sw{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14)}
.notes h3{font-size:13px;font-weight:600;color:#8a8880;margin:16px 0 6px}
.notes ul{padding-left:18px;margin:0}
.notes li{margin-bottom:6px}
@media (max-width:1000px){.notes{display:none}}

/* =====================================================================
   Phone frame
   ===================================================================== */
.phone{position:relative;width:390px;height:844px;flex:none;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-variant-numeric:tabular-nums;box-shadow:0 0 0 10px #101114,0 0 0 11px #3a3b40,0 30px 80px rgba(0,0,0,.5);transition:background .2s,color .2s}
.statusbar{display:flex;justify-content:space-between;align-items:center;height:48px;padding:8px 28px 0;font-size:15px;font-weight:600}
.batt{display:inline-block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;opacity:.8}
.batt i{display:block;width:70%;height:100%;border-radius:1.5px;background:currentColor}
.app{position:relative;display:flex;flex-direction:column;height:calc(100% - 48px)}
@media (max-width:480px){
  .stage{padding:0}
  .phone{width:100%;height:calc(100dvh - var(--barH,58px));border-radius:0;box-shadow:none}
  .statusbar{display:none}
  .app{height:100%}
}

/* =====================================================================
   Tokens. Concept-level (font, radii) then mode-level (colour) x 9.
   left / right  = solid side colour (dots, tags, timer label)
   left-tint     = large fill of the side button
   left-fg       = text on that tint
   ===================================================================== */
.phone[data-concept=a]{--font:'Manrope',system-ui,sans-serif;--r-lg:28px;--r-md:18px;--r-sm:14px}
.phone[data-concept=b]{--font:'Nunito',system-ui,sans-serif;--r-lg:32px;--r-md:24px;--r-sm:18px;
  --raise:-6px -6px 14px var(--hi),7px 7px 16px var(--sh);
  --raise-sm:-3px -3px 7px var(--hi),4px 4px 9px var(--sh);
  --sink:inset 4px 4px 10px var(--sh),inset -4px -4px 10px var(--hi)}
.phone[data-concept=c]{--font:'Barlow',system-ui,sans-serif;--r-lg:16px;--r-md:12px;--r-sm:8px}

.phone[data-concept=a][data-mode=light]{--bg:#f7f4ef;--surface:#fdfbf8;--surface2:#ede8e1;--line:transparent;--text:#231d1a;--muted:#7a6f66;--accent:#c27a3e;--accent-fg:#fff;
  --left:#c96f2e;--left-tint:#f4e1d0;--left-fg:#874618;--right:#a8556b;--right-tint:#f2dde3;--right-fg:#7a3a4d}
.phone[data-concept=a][data-mode=dark]{--bg:#1b1816;--surface:#242019;--surface2:#2e2823;--line:transparent;--text:#ebe3da;--muted:#a0948b;--accent:#d4894b;--accent-fg:#1b1816;
  --left:#e0935a;--left-tint:#3a2a1e;--left-fg:#f0b98b;--right:#d07a93;--right-tint:#38242b;--right-fg:#e8a2b6}
.phone[data-concept=a][data-mode=night]{--bg:#000;--surface:#0b0a09;--surface2:#151210;--line:transparent;--text:#9c9186;--muted:#5e564f;--accent:#b5651d;--accent-fg:#17130f;
  --left:#8a4f1c;--left-tint:#24140a;--left-fg:#a9866a;--right:#7a3b4a;--right-tint:#210f14;--right-fg:#a77d89}

.phone[data-concept=b][data-mode=light]{--bg:#f3e9df;--surface:#f3e9df;--surface2:#eadfd3;--line:transparent;--text:#3b2f28;--muted:#857568;--accent:#c86f3f;--accent-fg:#fff;
  --hi:rgba(255,255,255,.78);--sh:rgba(150,118,92,.36);
  --left:#e08a4e;--left-tint:#f5d6bb;--left-fg:#94491a;--right:#c2667f;--right-tint:#f0ccd6;--right-fg:#873b52}
.phone[data-concept=b][data-mode=dark]{--bg:#231c19;--surface:#231c19;--surface2:#2b2420;--line:transparent;--text:#ece2d8;--muted:#a59688;--accent:#dd8a55;--accent-fg:#231c19;
  --hi:rgba(255,255,255,.055);--sh:rgba(0,0,0,.55);
  --left:#e8995f;--left-tint:#41291a;--left-fg:#f3b98c;--right:#d27f98;--right-tint:#3e2229;--right-fg:#ecaabd}
.phone[data-concept=b][data-mode=night]{--bg:#000;--surface:#000;--surface2:#100d0b;--line:transparent;--text:#9c9186;--muted:#5e564f;--accent:#b5651d;--accent-fg:#17130f;
  --hi:rgba(255,255,255,.07);--sh:transparent;
  --raise:inset 0 1px 0 var(--hi),0 0 0 1px rgba(255,255,255,.045);
  --raise-sm:inset 0 1px 0 var(--hi),0 0 0 1px rgba(255,255,255,.045);
  --sink:inset 0 1px 0 rgba(0,0,0,.9),inset 0 -1px 0 var(--hi),0 0 0 1px rgba(255,255,255,.03);
  --left:#8a4f1c;--left-tint:#24140a;--left-fg:#ad8a6c;--right:#7a3b4a;--right-tint:#210f14;--right-fg:#a97f8b}

.phone[data-concept=c][data-mode=light]{--bg:#fbfaf7;--surface:#fff;--surface2:#f2eee8;--line:#e2dbd2;--text:#1f1a17;--muted:#6b625b;--accent:#9a5a1c;--accent-fg:#fff;
  --left:#c2703a;--left-tint:#fbeee3;--left-fg:#8a4718;--right:#a8556b;--right-tint:#f8e8ed;--right-fg:#7a384b}
.phone[data-concept=c][data-mode=dark]{--bg:#141211;--surface:#1d1a18;--surface2:#252120;--line:#2f2a27;--text:#e6ded5;--muted:#9a8f86;--accent:#d1884a;--accent-fg:#141211;
  --left:#d9905a;--left-tint:#2b1d14;--left-fg:#e9ad7e;--right:#cf7d96;--right-tint:#2a1a1f;--right-fg:#dd9cb0}
.phone[data-concept=c][data-mode=night]{--bg:#000;--surface:#0a0908;--surface2:#131110;--line:#211c18;--text:#9c9186;--muted:#5e564f;--accent:#b5651d;--accent-fg:#17130f;
  --left:#8a4f1c;--left-tint:#1c0f06;--left-fg:#a9866a;--right:#7a3b4a;--right-tint:#1a0b0f;--right-fg:#a77d89}

/* =====================================================================
   Shared app components (driven by the tokens above)
   ===================================================================== */
.hdr{display:flex;align-items:center;gap:8px;padding:8px 16px 12px;flex:none}
.status{flex:1;min-width:0}
.s1{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}
.s1 .side-tag{display:inline-flex;align-items:center;gap:6px}
.s1 .side-tag::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc,var(--accent))}
.s1 .side-tag[data-side=left]{--sc:var(--left)}
.s1 .side-tag[data-side=right]{--sc:var(--right)}
.s2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.s2 .s2side{display:none}

.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px;flex:none;max-width:120px}
.chip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-size:13px;font-weight:800;flex:none}
.chip .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .swap{display:none;color:var(--muted)}
.chip.bump .name{animation:bump .28s ease-out}
@keyframes bump{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.chip:active{opacity:.7}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text);background:var(--surface2);flex:none}
.ibtn:active{opacity:.7}

.stats{display:none}
.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.home{flex:1;min-height:0;display:flex;flex-direction:column}
.sides{flex:1;min-height:0;display:flex;gap:12px;padding:4px 12px 12px}
.side{position:relative;flex:1;display:flex;flex-direction:column;border-radius:var(--r-lg);padding:20px;text-align:left;transition:transform .12s,box-shadow .12s;overflow:hidden}
.side:active{transform:scale(.985)}
.side.left{background:var(--left-tint);color:var(--left-fg);--sc:var(--left)}
.side.right{background:var(--right-tint);color:var(--right-fg);--sc:var(--right)}
.side .lbl{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.side .next{display:none;align-items:center;gap:6px;font-size:13px;font-weight:700}
.side .next::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.side.is-next .next{display:inline-flex}
.side .meta{display:none}
.recent{display:none}

.history{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:10px 16px 0;flex:none;position:relative}
.tab{position:relative;z-index:1;flex:1;height:44px;border-radius:var(--r-sm);font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab .n{display:none}
.tab[aria-selected=true]{color:var(--text);background:var(--surface2)}
.knob{display:none}
.tabs.child{padding-top:8px}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.dayh .sum{display:none;font-weight:500}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 14px;text-align:left;color:var(--text)}
.row .ic{display:none}
.row .time{width:44px;flex:none;font-size:13px;color:var(--muted)}
.row .body{flex:1;min-width:0}
.row .title{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .detail{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{display:none}
.empty{padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}

.tabbar{display:flex;flex:none;padding:6px 8px 20px;background:var(--surface)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:11px;font-weight:600;color:var(--muted);border-radius:var(--r-sm);position:relative}
.tb[aria-current=page]{color:var(--accent)}

.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);padding:24px 20px 28px}
.ov-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ov-side{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:800}
.ov-side::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sc)}
.ov-side[data-side=left]{--sc:var(--left);color:var(--left-fg)}
.ov-side[data-side=right]{--sc:var(--right);color:var(--right-fg)}
.ov-clock{font-size:78px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ov-hint{font-size:14px;color:var(--muted)}
.ov-actions{display:flex;flex-direction:column;gap:10px}
.btn{height:56px;border-radius:var(--r-md);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{height:72px;font-size:20px;background:var(--accent);color:var(--accent-fg)}
.btn.secondary{background:var(--surface2);color:var(--text)}
.btn.ghost{height:48px;color:var(--muted)}

.toast{position:absolute;left:50%;bottom:104px;z-index:6;transform:translate(-50%,8px);opacity:0;padding:10px 16px;border-radius:999px;background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:14px;font-weight:600;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =====================================================================
   Option A - Minimalist & Sleek. Tone only; no borders, no shadows.
   ===================================================================== */
.phone[data-concept=a] .hdr{padding:6px 20px 14px}
.phone[data-concept=a] .s1{gap:10px}
.phone[data-concept=a] .s1 .ago{order:-1;font-size:26px;font-weight:800;letter-spacing:-.03em}
.phone[data-concept=a] .s1 .side-tag{display:none}
.phone[data-concept=a] .s2 .s2side{display:inline;font-weight:700;color:var(--text)}
.phone[data-concept=a] .side{justify-content:flex-end;align-items:flex-start;padding:22px}
.phone[data-concept=a] .side .next{position:absolute;top:20px;left:22px}
.phone[data-concept=a] .side .lbl{font-size:44px}
.phone[data-concept=a] .day{display:flex;flex-direction:column;gap:2px;border-radius:var(--r-md);overflow:hidden;margin-bottom:6px}
.phone[data-concept=a] .row{background:var(--surface)}
.phone[data-concept=a] .row:active{background:var(--surface2)}
.phone[data-concept=a] .tabbar{background:transparent}
.phone[data-concept=a] .tb[aria-current=page]{color:var(--text)}
.phone[data-concept=a] .tb[aria-current=page] svg{fill:currentColor;fill-opacity:.16}

/* =====================================================================
   Option B - Soft & Tactile. Raised pads, sinking press, carved troughs.
   ===================================================================== */
.phone[data-concept=b] .hdr{padding:10px 18px 14px;gap:8px}
.phone[data-concept=b] .s1{font-size:17px;font-weight:800}
.phone[data-concept=b] .chip{max-width:106px;padding:0 12px 0 6px}
.phone[data-concept=b] .chip,.phone[data-concept=b] .ibtn{background:var(--surface);box-shadow:var(--raise-sm)}
.phone[data-concept=b] .chip:active,.phone[data-concept=b] .ibtn:active{box-shadow:var(--sink);opacity:1}
.phone[data-concept=b] .sides{gap:16px;padding:8px 18px 18px}
.phone[data-concept=b] .side{justify-content:center;align-items:center;box-shadow:var(--raise);transition:box-shadow .12s}
.phone[data-concept=b] .side:active{transform:none;box-shadow:var(--sink)}
.phone[data-concept=b] .side .lbl{font-size:40px;font-weight:900;letter-spacing:.01em}
.phone[data-concept=b] .side .next{margin-top:10px}
.phone[data-concept=b] .side.is-next{box-shadow:var(--raise),0 0 0 4px var(--bg),0 0 0 7px color-mix(in srgb,var(--sc) 55%,transparent)}
.phone[data-concept=b] .side.is-next:active{box-shadow:var(--sink),0 0 0 4px var(--bg),0 0 0 7px color-mix(in srgb,var(--sc) 55%,transparent)}
.phone[data-concept=b] .tabs{margin:12px 18px 0;padding:4px;gap:0;border-radius:999px;background:var(--surface2);box-shadow:var(--sink)}
.phone[data-concept=b] .tabs.child{margin-top:10px}
.phone[data-concept=b] .tabs.child .tab{height:38px;font-size:13px}
.phone[data-concept=b] .tab{border-radius:999px;background:none!important}
.phone[data-concept=b] .knob{display:block;position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:999px;background:var(--surface);box-shadow:var(--raise-sm);transform:translateX(calc(var(--i)*100%));transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.phone[data-concept=b] .list{padding:4px 18px 18px}
.phone[data-concept=b] .dayh{padding:18px 10px 8px}
.phone[data-concept=b] .day{padding:4px 0;margin-bottom:6px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--raise)}
.phone[data-concept=b] .row{padding:10px 16px}
.phone[data-concept=b] .row+.row{border-top:1px solid color-mix(in srgb,var(--sh) 45%,transparent)}
.phone[data-concept=b] .row:active .ic{box-shadow:var(--sink)}
.phone[data-concept=b] .row .ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--raise-sm);color:var(--accent)}
.phone[data-concept=b] .row[data-side=left] .ic{color:var(--left)}
.phone[data-concept=b] .row[data-side=right] .ic{color:var(--right)}
.phone[data-concept=b] .row[data-kind=diaper] .ic{color:var(--muted)}
.phone[data-concept=b] .row .time{width:40px}
.phone[data-concept=b] .tabbar{box-shadow:0 -10px 24px var(--sh);padding:8px 10px 20px;gap:4px}
.phone[data-concept=b] .tb{border-radius:999px;min-height:54px}
.phone[data-concept=b] .tb[aria-current=page]{background:var(--surface);box-shadow:var(--raise-sm)}
.phone[data-concept=b] .btn{box-shadow:var(--raise)}
.phone[data-concept=b] .btn.secondary{background:var(--surface)}
.phone[data-concept=b] .btn.ghost{box-shadow:none}
.phone[data-concept=b] .btn:active{transform:none;box-shadow:var(--sink)}
.phone[data-concept=b] .ov-clock{font-weight:900}
.phone[data-concept=b] .toast{box-shadow:var(--raise)}

/* =====================================================================
   Option C - Modern Compact / Utility. Dense columns, 1px rules, numbers.
   ===================================================================== */
.phone[data-concept=c] .hdr{padding:4px 14px 8px;gap:8px}
.phone[data-concept=c] .s1{font-size:16px;font-weight:600}
.phone[data-concept=c] .s1 .side-tag::before{border-radius:2px}
.phone[data-concept=c] .s2{font-size:12px}
.phone[data-concept=c] .chip{height:40px;padding:0 10px 0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);max-width:130px;gap:6px}
.phone[data-concept=c] .chip .av{display:none}
.phone[data-concept=c] .chip .swap{display:block}
.phone[data-concept=c] .ibtn{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}
.phone[data-concept=c] .stats{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.phone[data-concept=c] .stats::-webkit-scrollbar{display:none}
.phone[data-concept=c] .st{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;flex:none}
.phone[data-concept=c] .st b{font-weight:700;color:var(--text)}
.phone[data-concept=c] .st svg{color:var(--muted)}
.phone[data-concept=c] .sides{gap:10px;padding:2px 12px 10px;flex:1 1 0}
.phone[data-concept=c] .side{justify-content:flex-start;align-items:flex-start;padding:16px;border:1px solid color-mix(in srgb,var(--sc) 35%,var(--line))}
.phone[data-concept=c] .side .lbl{font-size:30px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.phone[data-concept=c] .side .next{position:absolute;top:14px;right:14px;height:22px;padding:0 8px;border-radius:5px;background:var(--sc);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.phone[data-concept=c] .side .next::before{display:none}
.phone[data-concept=c] .side .meta{display:block;margin-top:auto;font-size:13px;line-height:1.35;color:inherit}
.phone[data-concept=c] .side .meta b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.phone[data-concept=c] .side .meta span{opacity:.75}
.phone[data-concept=c] .recent{display:block;flex:none;margin:0 12px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.phone[data-concept=c] .recent .dayh{padding:8px 14px 4px;font-size:12px;font-weight:600}
.phone[data-concept=c] .recent .row{min-height:40px;padding:4px 14px}
.phone[data-concept=c] .tabs{gap:0;padding:0 10px;border-bottom:1px solid var(--line)}
.phone[data-concept=c] .tab{border-radius:0;height:44px;font-weight:600;background:none!important;font-size:14px}
.phone[data-concept=c] .tab .n{display:inline;margin-left:4px;font-weight:500;color:var(--muted)}
.phone[data-concept=c] .tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent)}
.phone[data-concept=c] .tabs.child{border-bottom:0;padding:10px 14px 2px;gap:6px}
.phone[data-concept=c] .tabs.child .tab{flex:0 0 auto;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:var(--surface)!important}
.phone[data-concept=c] .tabs.child .tab[aria-selected=true]{background:var(--surface2)!important;color:var(--text);border-color:var(--muted)}
.phone[data-concept=c] .tabs.child .tab[aria-selected=true]::after{display:none}
.phone[data-concept=c] .list{padding:0}
.phone[data-concept=c] .dayh{position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 14px 6px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.phone[data-concept=c] .dayh .sum{display:inline}
.phone[data-concept=c] .row{min-height:48px;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.phone[data-concept=c] .row:active{background:var(--surface2)}
.phone[data-concept=c] .row .ic{display:block;color:var(--muted)}
.phone[data-concept=c] .row[data-side=left] .ic{color:var(--left)}
.phone[data-concept=c] .row[data-side=right] .ic{color:var(--right)}
.phone[data-concept=c] .row .time{width:40px;font-weight:600;color:var(--text)}
.phone[data-concept=c] .row .title{font-size:14px;font-weight:600}
.phone[data-concept=c] .row .detail{font-size:12px}
.phone[data-concept=c] .row .val{display:block;font-size:14px;font-weight:600;flex:none}
.phone[data-concept=c] .tabbar{border-top:1px solid var(--line);padding:0 0 18px}
.phone[data-concept=c] .tb{border-radius:0;font-weight:600}
.phone[data-concept=c] .tb[aria-current=page]::before{content:"";position:absolute;top:-1px;left:18px;right:18px;height:2px;background:var(--accent)}
.phone[data-concept=c] .btn.secondary{background:var(--surface);border:1px solid var(--line)}
.phone[data-concept=c] .ov-clock{font-weight:700;letter-spacing:-.01em}
.phone[data-concept=c] .toast{border-radius:var(--r-sm)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <h1>TinyTracker <small>design concepts</small></h1>
  <div class="seg" data-key="concept" role="group" aria-label="Concept">
    <button data-v="a">A · Minimal</button>
    <button data-v="b">B · Soft</button>
    <button data-v="c">C · Compact</button>
  </div>
  <div class="seg" data-key="mode" role="group" aria-label="Mode">
    <button data-v="light">Light</button>
    <button data-v="dark">Dark</button>
    <button data-v="night">Night</button>
  </div>
</header>

<main class="stage">
  <div class="phone" id="phone" data-concept="a" data-mode="light">
    <div class="statusbar"><span>14:54</span><span class="batt"><i></i></span></div>
    <div class="app">
      <header class="hdr">
        <div class="status">
          <div class="s1" id="s1"></div>
          <div class="s2" id="s2"></div>
        </div>
        <button class="chip" id="chip" data-act="child" aria-label="Switch child"></button>
        <button class="ibtn" id="themeBtn" data-act="theme" aria-label="Toggle theme"></button>
        <button class="ibtn" data-act="gear" aria-label="Settings"></button>
      </header>
      <div class="stats" id="stats"></div>
      <div class="screen">
        <section class="home" id="home">
          <div class="sides" dir="ltr">
            <button class="side left" data-act="start" data-side="left">
              <span class="next">Next</span>
              <span class="lbl">Left</span>
              <span class="meta" id="metaL"></span>
            </button>
            <button class="side right" data-act="start" data-side="right">
              <span class="next">Next</span>
              <span class="lbl">Right</span>
              <span class="meta" id="metaR"></span>
            </button>
          </div>
          <div class="recent" id="recent"></div>
        </section>
        <section class="history" id="history" hidden>
          <div class="tabs" id="tabs"></div>
          <div class="tabs child" id="childTabs"></div>
          <div class="list" id="list"></div>
        </section>
      </div>
      <div class="overlay" id="overlay" hidden>
        <div class="ov-top">
          <span class="ov-side" id="ovSide"></span>
          <span class="ov-clock" id="ovClock">00:00</span>
          <span class="ov-hint" id="ovHint"></span>
        </div>
        <div class="ov-actions">
          <button class="btn secondary" data-act="switch" id="switchBtn"></button>
          <button class="btn primary" data-act="stop">Stop feed</button>
          <button class="btn ghost" data-act="cancel">Cancel</button>
        </div>
      </div>
      <nav class="tabbar" id="tabbar"></nav>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
  <aside class="notes" id="notes"></aside>
</main>

<script>
/* ---------- icons: same drawings as src/components/ui/Icon.tsx ---------- */
const P = {
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  bottle:'<path d="M9 2h6M10 5h4M9.5 8h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2Z"/><path d="M10 5V2.5M14 5V2.5M8 13h8"/>',
  pump:'<path d="M7 10h10v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4M7 15h10"/>',
  diaper:'<path d="M4 6h16v4a9 9 0 0 1-8 9 9 9 0 0 1-8-9V6Z"/><path d="M4 10h5M15 10h5"/>',
  list:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>',
  drop:'<path d="M12 3c3 4 6 6.7 6 10a6 6 0 0 1-12 0c0-3.3 3-6 6-10Z"/>',
  poop:'<path d="M9 8a2.5 2.5 0 0 1 2.5-3.5c2 0 2.8 1.6 2.4 3.5"/><path d="M7.5 13a2.5 2.5 0 0 1 .3-5H15a2.5 2.5 0 0 1 1.5 5"/><path d="M6 18a2.5 2.5 0 0 1 1-5h10a2.5 2.5 0 0 1 1 5"/><path d="M5 18h14a2 2 0 0 1 0 4H5a2 2 0 0 1 0-4Z"/>',
  swap:'<path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/>'
};
const ico = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- mock data. "Now" is pinned at 14:54 so the "ago" copy is stable. ---------- */
const NOW = 14 * 60 + 54;
const CHILDREN = [{ id: 'maya', name: 'Maya' }, { id: 'eli', name: 'Eli' }];
const N = (c, d, t, side, l, r) => ({ c, d, t, k: 'nurse', side, dur: l + r, l, r });
const B = (c, d, t, ml, what) => ({ c, d, t, k: 'bottle', ml, what });
const PM = (d, t, l, r) => ({ c: null, d, t, k: 'pump', ml: l + r, l, r });
const D = (c, d, t, wet, dirty) => ({ c, d, t, k: 'diaper', wet, dirty });
const EVENTS = [
  N('maya', 0, '14:12', 'right', 0, 840), D('maya', 0, '12:40', true, false), N('maya', 0, '11:35', 'left', 1110, 0),
  PM(0, '10:05', 60, 60), D('maya', 0, '09:20', true, true), N('maya', 0, '08:10', 'right', 240, 495),
  B('maya', 0, '06:30', 60, 'expressed milk'), D('maya', 0, '05:50', false, true),
  N('maya', 1, '22:40', 'left', 960, 0), B('maya', 1, '21:10', 90, 'formula'), D('maya', 1, '19:30', true, false),
  N('maya', 1, '18:05', 'right', 0, 660), PM(1, '16:20', 50, 45),
  B('eli', 0, '13:30', 90, 'formula'), D('eli', 0, '12:45', true, false), N('eli', 0, '11:00', 'right', 0, 900),
  D('eli', 0, '09:40', true, true), N('eli', 0, '07:50', 'left', 780, 0),
  B('eli', 1, '22:15', 100, 'mixed'), D('eli', 1, '20:30', false, true), N('eli', 1, '18:30', 'left', 840, 0),
];
const TABS = [['all', 'All'], ['feeding', 'Feeding'], ['pumping', 'Pumping'], ['diapers', 'Diapers']];
const CAT = { all: () => true, feeding: e => e.k === 'nurse' || e.k === 'bottle', pumping: e => e.k === 'pump', diapers: e => e.k === 'diaper' };

const NOTES = {
  a: { name: 'Option A', sub: 'Minimalist & Sleek', thesis: 'Hierarchy by tone alone. No borders, no shadows; space and weight do the work, so the two big buttons are the only loud thing on the screen.',
    font: 'Manrope 600 / 700 / 800', radius: '28 / 18 / 14 px',
    look: ['Header is text on the background with no rule. The elapsed time is the headline, the side is a quiet tag.', 'Side buttons are tonal slabs with the label pinned bottom-left; "Next" is a dot plus a word in the top corner.', 'History groups each day into a soft block with 2 px gaps instead of dividers. Tabs are text pills.', 'Active tab-bar icon gets a faint fill instead of a colour change.'],
    caveats: ['Manrope has no Hebrew glyphs; production would pair it with Assistant or Heebo, or keep the system stack.', 'Light mode relies on small tone steps; test on a low-brightness phone outdoors.'] },
  b: { name: 'Option B', sub: 'Soft & Tactile', thesis: 'Everything is a pad you press. Depth tells you what is tappable, and a pressed side button visibly sinks, which is the one moment of delight.',
    font: 'Nunito 700 / 800 / 900', radius: '32 / 24 / 18 px',
    look: ['Surfaces share the background tone; a light highlight and a warm shadow give the lift.', 'The "Next" side wears a soft ring. Press and hold a side button to feel the inset.', 'History tabs are a carved trough with a sliding knob. Each day is a raised card with soft icon badges.', 'Tab bar floats on a shadow; the active tab is a small raised pill.'],
    caveats: ['Shadows vanish on true black, so Night keeps only a 1 px inner highlight and the tonal fills. The depth story is a Light / Dark story.', 'Nunito has no Hebrew glyphs; see Option A.', 'Softest contrast of the three; the muted text is close to the 4.5:1 floor in Light.'] },
  c: { name: 'Option C', sub: 'Modern Compact / Utility', thesis: 'Scan, do not read. Aligned columns, 1 px rules and right-aligned numbers so a tired parent gets the answer in one glance.',
    font: 'Barlow 500 / 600 / 700', radius: '16 / 12 / 8 px',
    look: ['A stat strip under the header summarises today for the selected child.', 'Each side button shows its own last feed and duration; "Next" is a small tag.', 'Home ends with the three most recent entries so you rarely need History at all.', 'History has sticky day headers with totals, an icon column, and the value right-aligned. Tabs carry counts.'],
    caveats: ['Densest of the three; at night the small 12 px copy is the first thing to lose legibility.', 'Barlow has no Hebrew glyphs; see Option A.', 'The recent list shrinks the side buttons to roughly 55% of the screen. If that is too small, drop the list.'] },
};

/* ---------- state ---------- */
const state = { concept: 'a', mode: 'light', screen: 'home', child: 'maya', tab: 'all', childTab: 'all', timer: null, events: EVENTS.slice() };
try { Object.assign(state, JSON.parse(localStorage.getItem('tt.concepts') || '{}')); } catch {}
const persist = () => { try { localStorage.setItem('tt.concepts', JSON.stringify({ concept: state.concept, mode: state.mode })); } catch {} };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const pad = n => String(n).padStart(2, '0');
const fmt = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const fmtH = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${pad(Math.floor((s % 3600) / 60))}m` : `${Math.floor(s / 60)}m`;
const ago = e => { if (e.d) return 'yesterday'; const d = NOW - mins(e.t); return d < 1 ? 'just now' : d < 60 ? `${d}m ago` : `${Math.floor(d / 60)}h ${d % 60}m ago`; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const other = s => (s === 'left' ? 'right' : 'left');
const child = () => CHILDREN.find(c => c.id === state.child);
const sorted = () => state.events.slice().sort((a, b) => a.d - b.d || mins(b.t) - mins(a.t));
const ofChild = id => sorted().filter(e => e.c === id || e.c === null);
const lastFeed = () => ofChild(state.child).find(e => e.k === 'nurse' || e.k === 'bottle');
const lastNurse = side => ofChild(state.child).find(e => e.k === 'nurse' && (!side || e.side === side));
const nextSide = () => { const n = lastNurse(); return n ? other(n.side) : 'left'; };

const describe = e => {
  if (e.k === 'nurse') return { icon: 'timer', title: `Nursing · ${cap(e.side)}`, detail: `L ${fmt(e.l)} · R ${fmt(e.r)}`, val: fmt(e.dur) };
  if (e.k === 'bottle') return { icon: 'bottle', title: 'Bottle', detail: e.what, val: `${e.ml} ml` };
  if (e.k === 'pump') return { icon: 'pump', title: 'Pumping', detail: `L ${e.l} · R ${e.r} ml`, val: `${e.ml} ml` };
  return { icon: e.wet && e.dirty ? 'diaper' : e.dirty ? 'poop' : 'drop', title: 'Diaper', detail: e.wet && e.dirty ? 'Wet + dirty' : e.dirty ? 'Dirty' : 'Wet', val: '' };
};
const rowHTML = (e, withName) => {
  const d = describe(e);
  const name = withName && e.c ? `${CHILDREN.find(c => c.id === e.c).name} · ` : '';
  return `<button class="row" data-act="row" data-kind="${e.k}" ${e.side ? `data-side="${e.side}"` : ''}>
    <span class="time">${e.t}</span><span class="ic">${ico(d.icon, 18)}</span>
    <span class="body"><span class="title">${name}${d.title}</span><span class="detail">${d.detail}</span></span>
    <span class="val">${d.val}</span></button>`;
};

/* ---------- renderers ---------- */
function renderChrome() {
  $('phone').dataset.concept = state.concept;
  $('phone').dataset.mode = state.mode;
  document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[seg.dataset.key]))));
  $('themeBtn').innerHTML = ico(state.mode === 'light' ? 'moon' : 'sun');
  document.querySelector('[data-act=gear]').innerHTML = ico('gear');
  renderNotes();
}
function renderHeader() {
  const f = lastFeed();
  if (!f) { $('s1').textContent = 'No feeds yet'; $('s2').textContent = 'Tap a side to start'; }
  else if (f.k === 'nurse') {
    $('s1').innerHTML = `<span class="side-tag" data-side="${f.side}">${cap(f.side)}</span><span class="ago">${ago(f)}</span>`;
    $('s2').innerHTML = `<span class="s2side">${cap(f.side)} · </span>fed for ${fmt(f.dur)}`;
  } else {
    $('s1').innerHTML = `<span class="side-tag">Bottle</span><span class="ago">${ago(f)}</span>`;
    $('s2').innerHTML = `<span class="s2side">Bottle · </span>${f.ml} ml · ${f.what}`;
  }
  const c = child();
  $('chip').innerHTML = `<span class="av">${c.name[0]}</span><span class="name">${c.name}</span><span class="swap">${ico('swap', 16)}</span>`;
}
function renderStats() {
  const today = ofChild(state.child).filter(e => e.d === 0);
  const nurse = today.filter(e => e.k === 'nurse');
  const feeds = today.filter(e => e.k === 'nurse' || e.k === 'bottle').length;
  const nursed = nurse.reduce((s, e) => s + e.dur, 0);
  const L = nurse.filter(e => e.side === 'left').length, R = nurse.length - L;
  const diapers = today.filter(e => e.k === 'diaper').length;
  $('stats').innerHTML = `<span class="st">${ico('timer', 14)}<b>${feeds}</b> feeds today</span><span class="st"><b>${fmtH(nursed)}</b> nursed</span><span class="st"><b>L ${L}</b> · <b>R ${R}</b></span><span class="st">${ico('diaper', 14)}<b>${diapers}</b> diapers</span>`;
}
function renderHome() {
  const next = nextSide();
  ['left', 'right'].forEach(s => {
    document.querySelector(`.side.${s}`).classList.toggle('is-next', s === next);
    const n = lastNurse(s);
    $(s === 'left' ? 'metaL' : 'metaR').innerHTML = n ? `<b>${fmt(n.dur)}</b><span>${n.t} · ${ago(n)}</span>` : '<span>No feed yet</span>';
  });
  const recent = ofChild(state.child).slice(0, 3);
  $('recent').innerHTML = `<div class="dayh"><span>Recent</span></div>${recent.map(e => rowHTML(e, false)).join('')}`;
}
function renderHistory() {
  const items = sorted().filter(CAT[state.tab]).filter(e => state.childTab === 'all' || e.c === state.childTab || e.c === null);
  const count = k => sorted().filter(CAT[k]).filter(e => state.childTab === 'all' || e.c === state.childTab || e.c === null).length;
  const ti = TABS.findIndex(t => t[0] === state.tab);
  $('tabs').style.cssText = `--n:${TABS.length};--i:${ti}`;
  $('tabs').innerHTML = `<span class="knob"></span>` + TABS.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${k === state.tab}">${l}<span class="n">${count(k)}</span></button>`).join('');
  const ct = [['all', 'All'], ...CHILDREN.map(c => [c.id, c.name])];
  const ci = ct.findIndex(t => t[0] === state.childTab);
  $('childTabs').style.cssText = `--n:${ct.length};--i:${ci}`;
  $('childTabs').innerHTML = `<span class="knob"></span>` + ct.map(([k, l]) => `<button class="tab" role="tab" data-act="childTab" data-v="${k}" aria-selected="${k === state.childTab}">${l}</button>`).join('');
  const days = [0, 1].map(d => items.filter(e => e.d === d)).filter(g => g.length);
  $('list').innerHTML = days.length ? days.map(g => {
    const nursed = g.filter(e => e.k === 'nurse').reduce((s, e) => s + e.dur, 0);
    const sum = `${g.length} logged${nursed ? ` · ${fmtH(nursed)} nursed` : ''}`;
    return `<div class="day"><div class="dayh"><span>${g[0].d ? 'Yesterday' : 'Today'}</span><span class="sum">${sum}</span></div>${g.map(e => rowHTML(e, state.childTab === 'all')).join('')}</div>`;
  }).join('') : '<div class="empty">Nothing logged here yet.</div>';
}
function renderTabbar() {
  const tabs = [['nurse', 'timer', 'Nurse'], ['bottle', 'bottle', 'Bottle'], ['pump', 'pump', 'Pump'], ['diaper', 'diaper', 'Diaper'], ['history', 'list', 'History']];
  const cur = state.screen === 'home' ? 'nurse' : 'history';
  $('tabbar').innerHTML = tabs.map(([k, i, l]) => `<button class="tb" data-act="nav" data-v="${k}" ${k === cur ? 'aria-current="page"' : ''}>${ico(i)}<span>${l}</span></button>`).join('');
}
function renderOverlay() {
  const t = state.timer;
  $('overlay').hidden = !t;
  if (!t) return;
  $('ovSide').dataset.side = t.side;
  $('ovSide').textContent = cap(t.side);
  $('ovClock').textContent = fmt(Math.floor((Date.now() - t.start) / 1000));
  $('ovHint').textContent = `${child().name} · started 14:54`;
  $('switchBtn').textContent = `Switch to ${t.side === 'left' ? 'right' : 'left'}`;
}
function renderNotes() {
  const n = NOTES[state.concept];
  const cs = getComputedStyle($('phone'));
  const sw = ['--bg', '--surface2', '--text', '--accent', '--left-tint', '--left', '--right-tint', '--right'].map(v => `<span class="sw" style="background:${cs.getPropertyValue(v)}" title="${v}"></span>`).join('');
  $('notes').innerHTML = `<h2>${n.name}</h2><p class="sub">${n.sub} · ${cap(state.mode)} mode</p><p class="thesis">${n.thesis}</p>
    <dl><dt>Typeface</dt><dd>${n.font}</dd><dt>Radii</dt><dd>${n.radius}</dd></dl>
    <div class="swatches">${sw}</div>
    <h3>What to look at</h3><ul>${n.look.map(l => `<li>${l}</li>`).join('')}</ul>
    <h3>Trade-offs</h3><ul>${n.caveats.map(l => `<li>${l}</li>`).join('')}</ul>
    <h3>Try it</h3><ul><li>Tap Left or Right, then Stop: the header updates to "just now".</li><li>Tap the child chip to switch between the twins.</li><li>Tap History, then the category and child tabs.</li><li>The moon / sun button cycles Light, Dark, Night.</li></ul>`;
}
function render() {
  renderChrome(); renderHeader(); renderStats(); renderHome(); renderHistory(); renderTabbar(); renderOverlay();
  $('home').hidden = state.screen !== 'home';
  $('history').hidden = state.screen !== 'history';
}

/* ---------- interactions ---------- */
let toastT;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
}
let tick;
function startTimer(side) {
  state.timer = { side, start: Date.now() };
  renderOverlay();
  tick = setInterval(renderOverlay, 250);
}
function endTimer(save) {
  clearInterval(tick);
  const t = state.timer; state.timer = null;
  if (save) {
    const dur = Math.max(1, Math.floor((Date.now() - t.start) / 1000));
    state.events.unshift({ c: state.child, d: 0, t: '14:54', k: 'nurse', side: t.side, dur, l: t.side === 'left' ? dur : 0, r: t.side === 'right' ? dur : 0 });
    toast(`Saved ${cap(t.side)} · ${fmt(dur)}`);
  }
  render();
}

document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state[seg.dataset.key] = b.dataset.v; persist(); render();
}));

$('phone').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'theme': state.mode = { light: 'dark', dark: 'night', night: 'light' }[state.mode]; persist(); render(); break;
    case 'gear': toast('Settings is not part of this mockup'); break;
    case 'child': {
      if (state.timer) return;
      state.child = CHILDREN[(CHILDREN.findIndex(c => c.id === state.child) + 1) % CHILDREN.length].id;
      render(); $('chip').classList.remove('bump'); void $('chip').offsetWidth; $('chip').classList.add('bump');
      toast(`Now logging ${child().name}`); break;
    }
    case 'nav':
      if (v === 'nurse') state.screen = 'home';
      else if (v === 'history') state.screen = 'history';
      else { toast(`${cap(v)} is not part of this mockup`); return; }
      render(); break;
    case 'start': startTimer(el.dataset.side); break;
    case 'switch': state.timer.side = other(state.timer.side); renderOverlay(); break;
    case 'stop': endTimer(true); break;
    case 'cancel': endTimer(false); break;
    case 'tab': state.tab = v; renderHistory(); break;
    case 'childTab': state.childTab = v; renderHistory(); break;
    case 'row': toast('Opens the edit sheet in the app'); break;
  }
});

const setBar = () => document.documentElement.style.setProperty('--barH', document.querySelector('.bar').offsetHeight + 'px');
window.addEventListener('resize', setBar);
setBar();
render();
</script>
</body>
</html>
